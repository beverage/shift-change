# Build, lint, and the invariants this codebase actually broke once each.
# Zero secrets. Tag a commit v* to additionally get a packaged mod zip on a
# GitHub Release. Workshop publishing is deliberately not automated here.
# Each check is explained in docs/DEVELOPMENT.md.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # pipefail matters here: GitHub's shell sets errexit but not pipefail, so
      # a `find` that fails on a renamed directory would drop a whole tree out
      # of validation and still show a green tick.
      - name: XML well-formedness
        shell: bash
        run: |
          set -o pipefail
          find About Defs Patches Languages -name '*.xml' -print0 | xargs -0 xmllint --noout

      # Hot-reload invariants, translation keys in both directions, XML-to-C#
      # type bindings, the <Patch> root walk, and the Workshop preview size.
      # One script so the same checks run locally before a push — see its
      # docstring for why each one exists.
      #
      # It replaced two shell greps that were anchored to the start of a line
      # and to a single line, and so missed `static private int x;`,
      # `[Attr] private int y;`, `class N { private int z; }` and every
      # multi-line auto-property. Measured against a file of such
      # declarations: the greps found 0, this finds 7.
      - name: Static invariants
        run: python3 devtools/check-invariants.py

      # An unclosed tag makes Steam render the remainder of the store page as
      # literal text, publicly, until someone notices. The validator has always
      # existed; nothing ran it.
      - name: Steam description BBCode
        run: python3 devtools/bbcode-preview.py media/steam-description.bbcode

      # A Debug build is instrumented and references EditCompileReload by
      # name; the Release build references nothing of it. The committed dll
      # must be the Release one — this catches the "forgot to rebuild before
      # staging" mistake mechanically.
      - name: Committed dll is a clean Release build
        run: |
          count=$(ls Assemblies/*.dll | wc -l)
          if [ "$count" != "1" ]; then
            echo "::error::Assemblies/ must hold exactly ShiftChange.dll (found $count dlls)"
            exit 1
          fi
          if ls Assemblies/*.dll_orig 2>/dev/null; then
            echo "::error::a .dll_orig is committed — Debug artifact, sweep with a Release build"
            exit 1
          fi
          if grep -q EditCompileReload Assemblies/ShiftChange.dll; then
            echo "::error::committed ShiftChange.dll references EditCompileReload — an instrumented Debug build was committed; rebuild with -c Release"
            exit 1
          fi

      # The other half of the same question, and deliberately NOT a grep: the
      # debug stages must be absent and the harness must be present, and .NET
      # keeps type names in #Strings (UTF-8) but string literals in #US
      # (UTF-16), so a grep for "-shiftchange-harness" finds nothing whether or
      # not it shipped. The script explains the trap and searches both.
      - name: Committed dll ships no debug scenes
        run: python3 devtools/check-shipped-dll.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Media carries the SCENES fixtures with Release codegen. It is only
      # built on filming days, so without this it can rot for weeks and the
      # breakage surfaces when someone is trying to capture footage.
      - name: Build (Media)
        run: dotnet build Source/ShiftChange/ShiftChange.csproj -c Media

      - name: Build (Release)
        run: dotnet build Source/ShiftChange/ShiftChange.csproj -c Release

      # Re-run against the FRESHLY BUILT dll, not just the committed one. The
      # committed check catches a mis-staged config; this catches a new debug
      # action that nobody wrapped in #if SCENES, which is the failure that
      # would otherwise ship silently.
      - name: Release build ships no debug scenes
        run: python3 devtools/check-shipped-dll.py

      - name: Assemblies swept after Release build
        run: |
          ls -la Assemblies/
          test "$(ls Assemblies/ | wc -l)" = "1"

  release:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build Source/ShiftChange/ShiftChange.csproj -c Release

      # The zip is the mod folder a player drops into Mods/ — game-loaded
      # content plus the human documents, no Source/, no CI, no dev tooling.
      - name: Assemble mod folder
        run: |
          mkdir -p dist/ShiftChange
          cp -R About Assemblies Defs Patches Languages docs LICENSE README.md dist/ShiftChange/
          cd dist && zip -r "ShiftChange-${GITHUB_REF_NAME}.zip" ShiftChange

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ShiftChange-*.zip --title "$GITHUB_REF_NAME" --generate-notes
